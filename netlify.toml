[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # Google Analytics measurement IDs are public browser configuration.
  # Keep secret scanning enabled, but do not treat this Vite-exposed value as a secret.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GA_MEASUREMENT_ID"

[[redirects]]
  from = "/projects/withyou"
  to = "/work/withyou"
  status = 301

[[redirects]]
  from = "/projects/dojonet"
  to = "/work/dojonet"
  status = 301

[[redirects]]
  from = "/projects/gundam-forge"
  to = "/work/gundam-forge"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/work"
  status = 301

[[redirects]]
  from = "/investigations"
  to = "/work"
  status = 301

[[redirects]]
  from = "/how-i-think"
  to = "/research"
  status = 301

[[redirects]]
  from = "/approach"
  to = "/research"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/field-notes"
  status = 301

[[redirects]]
  from = "/writing"
  to = "/field-notes"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
