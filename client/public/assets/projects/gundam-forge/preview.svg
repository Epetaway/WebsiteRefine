<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Abstract Gundam Forge decision-support interface</title>
  <desc id="desc">An original blue cockpit-inspired composition of card stacks, validation lines, and decision panels without franchise artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".58" stop-color="#111b38"/>
      <stop offset="1" stop-color="#080b13"/>
