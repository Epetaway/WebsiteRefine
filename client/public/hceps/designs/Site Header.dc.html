<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  a{color:#C65788;text-decoration:none}
  a:hover{color:#E4AE3A}
  @media (max-width:760px){
    [data-hd="desktop"]{display:none !important}
    [data-hd="toggle"]{display:inline-flex !important}
  }
</style>
</helmet>
<header style="position:relative;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(16px,2.5vw,24px) clamp(20px,6vw,88px);border-bottom:1px solid rgba(205,208,218,0.14);background:#10131B">
  <a href="Home.dc.html" style="display:flex;flex-direction:column;line-height:1.25;transition:background-color 220ms cubic-bezier(0.19,1,0.22,1),border-color 220ms cubic-bezier(0.19,1,0.22,1),color 220ms cubic-bezier(0.19,1,0.22,1),opacity 220ms cubic-bezier(0.19,1,0.22,1),transform 220ms cubic-bezier(0.19,1,0.22,1)" style-hover="opacity:0.75">
    <span style="font-family:'Source Serif 4',Georgia,serif;font-size:19px;color:#F2EDE3">Earl Hickson Jr.</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.28em;color:#C65788;margin-top:2px">HCEPS</span>
  </a>
  <nav data-hd="desktop" style="display:flex;gap:clamp(18px,2.6vw,34px);align-items:center">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="{{ n.style }};transition:background-color 220ms cubic-bezier(0.19,1,0.22,1),border-color 220ms cubic-bezier(0.19,1,0.22,1),color 220ms cubic-bezier(0.19,1,0.22,1),opacity 220ms cubic-bezier(0.19,1,0.22,1),transform 220ms cubic-bezier(0.19,1,0.22,1)" style-hover="color:#F2EDE3">{{ n.label }}</a>
    </sc-for>
  </nav>
  <button data-hd="toggle" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" style="display:none;align-items:center;gap:8px;background:none;border:1px solid rgba(205,208,218,0.3);padding:9px 14px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;color:#F2EDE3;min-height:44px;transition:background-color 220ms cubic-bezier(0.19,1,0.22,1),border-color 220ms cubic-bezier(0.19,1,0.22,1),color 220ms cubic-bezier(0.19,1,0.22,1),opacity 220ms cubic-bezier(0.19,1,0.22,1),transform 220ms cubic-bezier(0.19,1,0.22,1)" style-hover="border-color:#C65788;color:#C65788;transform:translateY(-2px)">{{ menuLabel }}</button>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="position:absolute;top:100%;left:0;right:0;z-index:90;background:#151923;border-bottom:1px solid rgba(205,208,218,0.18);display:flex;flex-direction:column;padding:8px clamp(20px,6vw,88px) 18px;box-shadow:0 18px 40px rgba(0,0,0,0.5)">
      <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="7">
        <a href="{{ m.href }}" style="{{ m.style }}">{{ m.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;84&quot;}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;research&quot;, &quot;investigations&quot;, &quot;writing&quot;, &quot;about&quot;, &quot;resume&quot;, &quot;contact&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Navigation&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const active = this.props.active ?? "home";
    const links = [
      { id: "research", label: "Research", href: "Research.dc.html" },
      { id: "investigations", label: "Investigations", href: "Investigations.dc.html" },
      { id: "writing", label: "Writing", href: "Writing.dc.html" },
      { id: "about", label: "About", href: "About.dc.html" },
      { id: "resume", label: "Resume", href: "Resume.dc.html" },
      { id: "contact", label: "Contact", href: "Contact.dc.html" },
    ];
    const navItems = links.map((l) => ({
      label: l.label,
      href: l.href,
      style: l.id === active
        ? "font-family:Manrope,sans-serif;font-size:13.5px;color:#F2EDE3;border-bottom:1px solid #C65788;padding-bottom:2px"
        : "font-family:Manrope,sans-serif;font-size:13.5px;color:rgba(205,208,218,0.66)",
    }));
    const mLinks = [{ id: "home", label: "Home", href: "Home.dc.html" }].concat(links);
    const menuItems = mLinks.map((l, i) => ({
      label: l.label,
      href: l.href,
      style: "font-family:Manrope,sans-serif;font-size:16px;padding:13px 0;color:" + (l.id === active ? "#C65788" : "rgba(205,208,218,0.8)") + (i < mLinks.length - 1 ? ";border-bottom:1px solid rgba(205,208,218,0.1)" : ""),
    }));
    return {
      navItems: navItems,
      menuItems: menuItems,
      menuOpen: this.state.menuOpen,
      menuLabel: this.state.menuOpen ? "CLOSE ✕" : "MENU ☰",
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
